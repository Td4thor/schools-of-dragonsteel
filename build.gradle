plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group
base { archivesName = 'schools_of_dragonsteel' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    // Native GameTests. Kept out of the release jar.
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // The optional Apex Only add-on: its own tiny jar (apexOnlyJar). Its presence makes only Apex spells finish steel.
    apexonly {
        compileClasspath += sourceSets.main.compileClasspath
    }
    // Dev-only client smoke harness (runClient -Pdsqa). Kept out of the release jar.
    qa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // Iron's Spells, Ice and Fire, Citadel, Curios, GeckoLib and playerAnimator ship SRG refmaps.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            jvmArgs '-Xmx4G'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('dsqa')) {
                // Loads run/saves/<dsqaWorld>, equips each set, takes screenshots, then quits. See src/qa.
                property 'dragonsteel_schools.qa', 'true'
                property 'dragonsteel_schools.qa.schools', project.findProperty('dsqaSchools') ?: ''
                args '--quickPlaySingleplayer', project.findProperty('dsqaWorld') ?: 'QA', '--width', '1920', '--height', '1080'
                mods { "${mod_id}" { source sourceSets.qa } }
            }
        }
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('build/gametest-run')
            property 'forge.enabledGameTestNamespaces', mod_id
            mods { "${mod_id}" { source sourceSets.gametest } }
        }
    }
}

repositories {
    maven {
        name = "Iron's Spells"
        url = 'https://code.redspace.io/releases'
        content { includeGroup 'io.redspace' }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven {
        name = 'playerAnimator'
        url = 'https://maven.kosmx.dev/'
        content { includeGroup 'dev.kosmx.player-anim' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    // Ice and Fire, Citadel, Ice and Fire: Spellbooks and Apex Arcana: copied by tools/prepare_dependencies.py.
    flatDir { dirs 'libs' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("io.redspace:irons_spellbooks:${irons_spellbooks_version}")
    implementation fg.deobf("io.redspace:irons_lib:${irons_lib_version}")
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${playeranimator_version}")

    // Runtime only. The mod never imports these; GameTests drive them through their registries and reflection.
    runtimeOnly fg.deobf("local:iceandfire:${iceandfire_version}")
    runtimeOnly fg.deobf("local:citadel:${citadel_version}")
    runtimeOnly fg.deobf("local:ice_and_fire_spellbooks:${iafsb_version}")
    runtimeOnly fg.deobf("local:grandsigil:${grandsigil_version}")

    // JEI pages (compat/jei). Optional: only JEI loads that package. Built against the API of the oldest JEI in
    // Tad's instances; the dev client loads the full JEI only for the QA harness (-Pdsqa).
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    if (project.hasProperty('dsqa')) {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

def resourceProps = [mod_id: mod_id, mod_version: mod_version]
processResources {
    inputs.properties resourceProps
    filesMatching(['META-INF/mods.toml']) { expand resourceProps }
}
tasks.named('processApexonlyResources', ProcessResources) {
    inputs.properties resourceProps
    filesMatching(['META-INF/mods.toml']) { expand resourceProps }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'dragonsteel.projectDir', projectDir.absolutePath
    testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full' }
}

// The refmap remapping file must exist before any run starts.
tasks.matching { it.name.startsWith('prepareRun') }.configureEach { dependsOn 'createSrgToMcp' }

tasks.configureEach {
    if (name == 'runGameTestServer') {
        // Every GameTest run starts from a fresh disposable world.
        doFirst { delete layout.buildDirectory.dir('gametest-run/world').get().asFile }
    }
}

tasks.register('verifyGameTests', Exec) {
    description = 'Runs the GameTest server and rejects partial or misleading results.'
    dependsOn 'runGameTestServer'
    commandLine 'python', 'tools/verify_gametest_log.py', 'build/gametest-run/logs/latest.log'
}

// Ice and Fire: Schools of Dragonsteel is LGPL-3.0-only (some of its sprites are derived from Ice and Fire's
// LGPL-3.0 art). The licence travels inside every jar, and the release ships a sources jar as its Corresponding Source.
def licenceFiles = { CopySpec spec ->
    spec.from('LICENSE') { rename { 'LICENSE_dragonsteel_schools' } }
    spec.from('COPYING') { rename { 'COPYING_dragonsteel_schools' } }
    spec.from('docs/art/CREDITS.md') { rename { 'CREDITS_dragonsteel_schools.md' } }
}

tasks.named('jar', Jar) {
    licenceFiles(it)
    manifest {
        attributes(
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : 'Td4thor and Hastur',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Ice and Fire: Schools of Dragonsteel',
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'Td4thor and Hastur'
        )
    }
    finalizedBy 'reobfJar'
}

// The Apex Only add-on references nothing from Minecraft (only FML's @Mod), so it needs no reobfuscation.
tasks.register('apexOnlyJar', Jar) {
    archiveBaseName = 'schools_of_dragonsteel_apex_only'
    from sourceSets.apexonly.output
    licenceFiles(it)
    manifest {
        attributes(
            'Specification-Title'   : 'dragonsteel_schools_apex_only',
            'Specification-Vendor'  : 'Td4thor and Hastur',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Ice and Fire: Schools of Dragonsteel - Apex Only',
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'Td4thor and Hastur'
        )
    }
}
// The Corresponding Source the LGPL asks for: everything needed to rebuild both jars (third-party jars excepted;
// tools/prepare_dependencies.py fetches those into libs/).
tasks.register('releaseSourcesJar', Jar) {
    archiveBaseName = 'schools_of_dragonsteel'
    archiveClassifier = 'sources'
    from(projectDir) {
        include 'src/main/**', 'src/apexonly/**', 'src/gametest/**', 'src/qa/**', 'tools/**', 'docs/*.md', 'docs/art/CREDITS.md'
        include 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradlew', 'gradlew.bat', 'gradle/**'
        include 'LICENSE', 'COPYING', 'README.md', 'CHANGELOG.md', '.gitignore', '.gitattributes'
        exclude '**/__pycache__/**'
    }
}
tasks.named('build') { dependsOn 'apexOnlyJar', 'releaseSourcesJar' }
