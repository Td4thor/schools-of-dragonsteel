[[mods]]
modId="dragonsteel_schools"
version="${mod_version}"
displayName="Ice and Fire: Schools of Dragonsteel"
authors="Td4thor and Hastur"
description='''Dragonsteel for every school of magic. Holy, Ender, Blood, Evocation, Nature and Eldritch each get their own dragonsteel armour, sword, tools and Dragon Priest staff.

Fill a cauldron with dragon's breath and cast a spell of your school into it to brew that school's dragon blood. Temper iron with it in a dragon forge while a dragon breathes on it, then cast a spell of that school at Legendary rarity at the forge to finish the steel. Apex Arcana's Apex spells finish it too; the optional Apex Only add-on makes them the only way.'''

[[dependencies.dragonsteel_schools]]
    modId="forge"
    mandatory=true
    versionRange="[47.4.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.dragonsteel_schools]]
